type: charm

parts:
  charm:
    source: src/
    plugin: reactive
    build-packages:
      - libpython3-dev
    build-snaps:
      - charm/latest/edge
    build-environment:
      - CHARM_INTERFACES_DIR: /root/project/interfaces/
      - CHARM_LAYERS_DIR: /root/project/layers/

bases:
  - build-on:
      - name: ubuntu
        channel: "22.04"
        architectures:
          - amd64
    run-on:
      - name: ubuntu
        channel: "22.04"
        architectures: [amd64, s390x, ppc64el, arm64]
  - build-on:
      - name: ubuntu
        channel: '24.04'
        architectures:
          - amd64
    run-on:
      - name: ubuntu
        channel: '24.04'
        architectures:
          - amd64
          - s390x
          - ppc64el
          - arm64
